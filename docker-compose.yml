services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reuse
      POSTGRES_PASSWORD: reuse
      POSTGRES_DB: reuse
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "reuse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data: